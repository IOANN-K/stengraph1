[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stengraph"
version = "0.1.0"
description = "Educational PNG LSB steganography and steganalysis research code"
requires-python = ">=3.14"
dependencies = [
  "Pillow==12.3.0",
  "numpy==2.5.3",
  "scipy==1.18.1",
  "scikit-image==0.26.0",
  "scikit-learn==1.9.1",
  "matplotlib==3.11.1",
  "cryptography==50.0.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
